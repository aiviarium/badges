name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VALE_VERSION: 3.25.1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npm test
      - name: src/data.json matches projects.json and the assets
        run: |
          pip install fonttools brotli
          python tools/build.py
          git diff --exit-code src/data.json
      - name: The worker builds
        run: npx cf deploy --dry-run
      - name: Install Vale
        run: |
          curl -fsSL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" vale
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Vale exits with an error only for alerts at error level. A warning
      # fails the check too.
      - name: Prose
        run: |
          found=$(vale --minAlertLevel=warning --output=line README.md) || true
          [ -z "$found" ] || { echo "$found"; exit 1; }
